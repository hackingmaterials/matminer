# Settings for the bots and their gate scripts: autotriage_guard.sh, the only
# way the triage bot can merge, and autofix_publish.sh, the only way a bot
# change gets committed. Both bots read this file too.
#
# Format: one "key = value" per line. Comments go on their own lines.
# Repeat a key to add another value. Patterns are bash globs matched against
# the full path from the repo root; "*" also matches "/".

# The mode sets what the bots may do. The settings below refine it.
#   conservative  Code review only: comments, labels, escalations. Never
#                 merges or commits, whatever the settings below say.
#   normal        Also merges easy PRs: docs, dependency upgrades, and small
#                 code changes with tests. On "@claude fix", opens a draft PR
#                 for an issue, or commits to a PR. Never merges its own work.
#   mayhem        Also merges anything that passes CI and its review, its own
#                 fixes included. Still escalates security and cost risks,
#                 protected files, and the domain risk areas in the rules.
# A missing mode means conservative.
mode = normal

# How many PRs the scheduled sweep may act on (comment, label, or merge) per
# run. How often it runs is the cron line in workflows/autotriage.yml. A
# maintainer can also comment "@claude sweep" on any issue or PR to run it now.
max_prs_per_run = 10

# on = maintainers can tag @claude on any issue or PR for an answer, an
# investigation, or a review, or "@claude sweep" to run the sweep now.
# off = the bot ignores mentions, "@claude sweep" included. Scheduled sweeps
# and "@claude fix" (see autofix) are separate.
mentions = on

# Optional: the kinds of PR the bot may merge, replacing the mode's list.
#   docs      only files matching docs_paths
#   deps      bot dependency PRs (see deps_branch)
#   tested    code changes that also change a file matching test_paths
#   reviewed  anything that passes CI and the bot's review
#   none      nothing
# normal = docs, deps, tested. mayhem = docs, deps, tested, reviewed.
# merge = docs
# merge = deps
merge = deps
merge = docs
merge = tested

# Optional: off = no "@claude fix", even in normal or mayhem mode.
# autofix = off
# Or set it separately for fixes to PRs and fixes to issues (opens a PR).
# autofix_prs = off
# autofix_issues = off
autofix_prs = on
autofix_issues = on

# Optional: yes = the bot may merge its own autofix/* PRs, and opens them
# ready for review instead of as drafts. Default: yes in mayhem, else no.
# merge_own_fixes = no
merge_own_fixes = yes

# yes = in a repo with no CI at all, the bot may merge on its own review.
# "No CI" means no workflows besides autotriage's own, and no other CI
# service's config. Once the repo has any CI, every merge needs green checks.
allow_no_ci = no

# Branch PRs must target. Leave unset to use the repository's default branch.
# base_branch = main

# How to merge: squash, merge, or rebase.
merge_method = squash

# Refuse PRs with more added + deleted lines than this, tests included.
# 0 = no limit. Dependency PRs are exempt.
max_changed_lines = 300

# Limits on one bot change ("@claude fix"), tests included.
autofix_max_files = 10
autofix_max_changed_lines = 1000
# If listed, bot changes may only touch files matching these.
# autofix_paths = src/*
# autofix_paths = tests/*

# The bot never merges a PR carrying one of these labels. A human removes the
# label to release it. Keep the label the bot adds when it escalates.
block_label = review requested
block_label = do not merge

# Optional: the bot never merges PRs from these branches.
# block_branch = release/*

# Files that count as documentation, for "merge = docs".
docs_paths = docs/*
docs_paths = *.md
docs_paths = *.rst

# Files that count as tests, for "merge = tested" and for issue fixes, which
# must include a regression test if they add or edit code (not for changes
# that only touch docs_paths or only delete files).
test_paths = tests/*
test_paths = *test_*.py
test_paths = *_test.py

# No bot merges or commits a change to these; a human always decides.
# CI, automation, and repo settings:
protected = .github/*
protected = .pre-commit-config.yaml
protected = CODEOWNERS
protected = docs/CODEOWNERS
# Packaging, build, and release:
protected = setup.py
protected = setup.cfg
protected = MANIFEST.in
protected = environment*.yml
protected = Dockerfile*
# Agent instructions and prompts, which change behavior:
protected = .claude/*
protected = *CLAUDE.md
protected = *AGENTS.md
protected = *SKILL.md
# Environment and credential templates:
protected = *.env*
# Licensing, citation, and governance:
protected = LICENSE*
protected = CITATION*
protected = SECURITY*
# Large or binary data, which can't be reviewed in a diff:
protected = *.gz
protected = *.zip
protected = *.h5
protected = *.pkl
protected = *.npy
protected = *.npz

# Branches of bot dependency-upgrade PRs, for "merge = deps". These must come
# from this repo, not a fork, and may only change files matching deps_paths.
deps_branch = auto-dependency-upgrades
deps_paths = requirements/*
